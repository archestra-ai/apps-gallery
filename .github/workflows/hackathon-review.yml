name: Hackathon review intake

# When a submission PR opens, trigger the org-wide Hackathon agent to run intake:
# it ingests the submission onto the review board, mints the replay chat link (which
# makes the board post the Slack review card), and assigns a reviewer. We only read
# PR metadata + the submission's recording.json as data via the API — this never
# checks out or runs any code from the fork. Runs in BASE context so the agent token
# is available; the agent reaches the board internally, so the board needs no public
# endpoint.
#
# Requires (skips cleanly if unset):
#   vars.HACKATHON_AGENT_A2A_URL   — the Hackathon agent's A2A endpoint (…/v2/a2a/<agentId>)
#   secrets.HACKATHON_A2A_TOKEN    — an Archestra bearer token (archestra_…) for that endpoint
on:
  # zizmor: ignore[dangerous-triggers] — intentional: needs the agent token (base
  # context) to trigger the review agent. Checks out the base ref with no persisted
  # credentials and never runs fork code (it only parses recording.json as data).
  pull_request_target:
    # review_requested / review_request_removed: the reviewer SET can change without a content
    # push — re-run intake so the board's reviewers (and the Slack card, which only posts once a
    # reviewer is known) stay in sync. No `paths` filter: those events carry no file diff, and the
    # job itself checks the PR's files and no-ops unless it contains a submission recording.json.
    types: [opened, reopened, synchronize, review_requested, review_request_removed]

permissions: {} # deny-all baseline; the job grants only what it needs

concurrency:
  group: hackathon-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  intake:
    name: Trigger the Hackathon agent
    runs-on: ubuntu-latest
    permissions:
      contents: read # gh api: read the submission bundle
      pull-requests: read # gh pr view: changed-file list + metadata
    steps:
      # base ref (trusted): our own scripts/lib, never fork code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Send submission(s) to the Hackathon agent
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REPO: ${{ github.repository }}
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          # Fork coordinates via env (never inlined into a script) so a crafted
          # repo/branch name can't be interpreted as shell.
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HACKATHON_AGENT_A2A_URL: ${{ vars.HACKATHON_AGENT_A2A_URL }}
          HACKATHON_A2A_TOKEN: ${{ secrets.HACKATHON_A2A_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${HACKATHON_AGENT_A2A_URL:-}" ] || [ -z "${HACKATHON_A2A_TOKEN:-}" ]; then
            echo "HACKATHON_AGENT_A2A_URL / _TOKEN not configured — skipping agent intake."
            exit 0
          fi

          # PR files (all of them, base-context metadata only — works for any event type, incl.
          # review_requested which carries no diff).
          paths=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json files --jq '.files[].path')

          recordings=$(printf '%s\n' "$paths" | grep -E '^apps/[^/]+/recording\.json$' || true)
          if [ -z "$recordings" ]; then
            echo "No submission recording.json in this PR; nothing to send."
            exit 0
          fi

          # The PR's CURRENT requested reviewers (users + teams) — the source of truth the board
          # uses; the agent must not guess. Teams surface as their slug (org/team), kind=team.
          REVIEWERS_JSON=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json reviewRequests \
            --jq '[.reviewRequests[] | if (.__typename // .type) == "Team" then {login: .slug, kind: "team", name: .name} else {login: .login, kind: "user"} end]')
          export REVIEWERS_JSON

          while IFS= read -r recording; do
            [ -z "$recording" ] && continue
            dir=$(printf '%s' "$recording" | cut -d/ -f2)

            # raw.githubusercontent (NOT github.com/…/raw, which 302s to a text/html page the
            # ui:// sandbox img / Slack can't render) — commit-pinned at the PR head.
            RECORDING_URL="https://raw.githubusercontent.com/$HEAD_REPO/$HEAD_SHA/$recording"
            export RECORDING_URL

            # Optional thumbnail → commit-pinned raw URL. Match the dir with a fixed-string grep
            # (never interpolate it into a regex).
            thumb=$(printf '%s\n' "$paths" \
              | grep -E '^apps/[^/]+/thumbnail\.(png|jpg|jpeg|webp)$' \
              | grep -F "apps/$dir/" | head -n1 || true)
            thumb_url=""
            [ -n "$thumb" ] && thumb_url="https://raw.githubusercontent.com/$HEAD_REPO/$HEAD_SHA/$thumb"

            # Pull the bundle JSON as data (raw media type handles bundles >1MB).
            gh api "repos/$HEAD_REPO/contents/$recording?ref=$HEAD_SHA" \
              -H "Accept: application/vnd.github.raw" > recording.json

            node scripts/ci/notify-review.mjs recording.json "$thumb_url"
          done <<< "$recordings"
